name: CI Notify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
      - name: Run unit tests with coverage
        run: npm test -- --coverage
      - name: Discord - success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "Build geslaagd"}' \
            ${{ secrets.DISCORD_WEBHOOK }}
      - name: Discord - push main success
        if: success() && github.event_name == 'push'
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "Build geslaagd op main (push)"}' \
            ${{ secrets.DISCORD_WEBHOOK }}
      - name: Discord - PR success
        if: success() && github.event_name == 'pull_request'
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "Build geslaagd voor PR (branch ${{ github.head_ref }})"}' \
            ${{ secrets.DISCORD_WEBHOOK }}
      - name: Discord - push main failure
        if: failure() && github.event_name == 'push'
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "Build GEFAALD op main (push)"}' \
            ${{ secrets.DISCORD_WEBHOOK }}
      - name: Discord - PR failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "Build GEFAALD voor PR (branch ${{ github.head_ref }})"}' \
            ${{ secrets.DISCORD_WEBHOOK }}
