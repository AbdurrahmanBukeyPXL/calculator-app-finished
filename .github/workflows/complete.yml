name: Complete Example
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Build the code
        run: |
          npm install
          zip -r app.zip . -x ".git/*"
      - name: Test the code
        run: npm test -- --coverage
