name: Quality
on: 
  pull_request:
    types: [opened]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch code
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm install
      - name: ESLint
        run: npm run lint
      - name: Unittests
        run: npm test -- --coverage
      - name: archive
        uses: actions/upload-artifact@v4
        if: always() # ook na falende tests
        with:
          name: test-results
          path: coverage/
      - name: test-reporter
        uses: mridang/action-test-reporter@v1.3.0
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: coverage/lcov.info
